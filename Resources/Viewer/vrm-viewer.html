<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRM Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; -webkit-app-region: drag; }
  canvas { display: block; }
  /* 顶部拖拽条（窗口标题栏） */
  #titlebar {
    position: fixed; top: 0; left: 0; right: 0; height: 32px;
    -webkit-app-region: drag;
    z-index: 100;
  }
  /* 右键菜单按钮（排除拖拽） */
  #titlebar .btn {
    -webkit-app-region: no-drag;
    cursor: pointer;
  }
  #status {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #ccc; font-size: 16px; text-align: center; pointer-events: none;
    transition: opacity 0.5s; z-index: 10;
  }
  #status.hidden { display: none; }
  #status.error { color: #ff6b6b; }
  .spinner {
    display: inline-block; width: 32px; height: 32px; margin-bottom: 12px;
    border: 3px solid rgba(255,255,255,0.2); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #info {
    display: none;
    position: absolute; top: 8px; left: 8px; color: #aaa; font-size: 11px;
    background: rgba(0,0,0,0.55); padding: 8px 10px; border-radius: 4px;
    pointer-events: none; z-index: 5; max-width: 300px; line-height: 1.6;
  }
  /* 聊天气泡 */
  #chatBubble {
    display: none;
    position: absolute; top: 10px; left: 10px;
    background: rgba(255,255,255,0.8); border-radius: 12px;
    padding: 8px 12px; max-width: 220px;
    -webkit-app-region: no-drag; cursor: pointer; z-index: 200;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    font-family: 'Microsoft YaHei', sans-serif;
  }
  #chatBubble .bubble-row { display: flex; align-items: center; gap: 8px; }
  #chatBubble .avatar {
    width: 24px; height: 24px; border-radius: 12px;
    background: #6B5CE7; color: #fff; font-size: 12px; font-weight: bold;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  #chatBubble .text {
    color: #333; font-size: 13px; line-height: 1.4;
    overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
</style>
</head>
<body>
<div id="titlebar"></div>
<div id="status"><div class="spinner"></div><div>Loading...</div></div>
<div id="info"></div>
<div id="chatBubble">
  <div class="bubble-row">
    <div class="avatar" id="bubbleAvatar">宠</div>
    <div class="text" id="bubbleText"></div>
  </div>
</div>

<script>
var statusEl = document.getElementById('status');
function showError(html) {
  statusEl.className = 'error';
  statusEl.style.opacity = '1';
  statusEl.innerHTML = html;
}
window.onerror = function(msg) {
  showError('<div>Script Error</div><div style="font-size:12px;margin-top:8px">' + msg + '</div>');
};
window.addEventListener('unhandledrejection', function(e) {
  showError('<div>Promise Error</div><div style="font-size:12px;margin-top:8px">' + (e.reason?.message || e.reason) + '</div>');
});
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module" src="./viewer.js"></script>
<script>
// 聊天气泡（供 C# ExecuteScriptAsync 调用）
const _bubble = document.getElementById('chatBubble');
const _bubbleAvatar = document.getElementById('bubbleAvatar');
const _bubbleText = document.getElementById('bubbleText');

function showBubble(text, avatar) {
  _bubbleAvatar.textContent = avatar || '宠';
  _bubbleText.textContent = text || '';
  _bubble.style.display = 'block';
}

function hideBubble() {
  _bubble.style.display = 'none';
}

if (window.chrome?.webview) {
  _bubble.addEventListener('click', () => {
    hideBubble();
    window.chrome.webview.postMessage(JSON.stringify({ type: 'bubbleClicked' }));
  });
  // 右键切换工具栏
  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    window.chrome.webview.postMessage(JSON.stringify({ type: 'toggleToolbar' }));
  });
}
</script>
</body>
</html>
